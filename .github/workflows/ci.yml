name: Project checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js && node --check seed.js && node --check sre.js
      - name: Run backend SRE tests
        working-directory: backend
        run: npm test
      - name: Check frontend palette tokens
        run: node scripts/check-hex.mjs
      - name: Check root development script syntax
        run: node --check scripts/dev.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
