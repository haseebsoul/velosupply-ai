name: Project checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Commit refreshed backend lockfile on Pakistan Edition branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/pakistan/v15'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh backend dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify reproducible backend install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js && node --check seed.js && node --check sre.js && node --check migrate-state.js && node --check repository/index.js && node --check repository/collection-map.js && node --check repository/file-adapter.js && node --check repository/mongo-adapter.js && node --check repository/domain-repositories.js
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Check frontend palette tokens
        run: node scripts/check-hex.mjs
      - name: Check root development script syntax
        run: node --check scripts/dev.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
